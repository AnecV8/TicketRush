name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'docs/**/*.md' README.md
          fail: true

      - name: Validate C4 workspace
        run: >
          docker run --rm
          -v "$PWD/docs/c4:/usr/local/structurizr"
          structurizr/cli validate -workspace workspace.dsl
