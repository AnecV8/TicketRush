services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
      POSTGRES_DB: ticketrush
    ports: ["5432:5432"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ticketrush -d ticketrush" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: [ "19092:19092" ]
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]

  observabilite:
    image: grafana/otel-lgtm:0.8.1
    ports: ["3000:3000", "4317:4317", "4318:4318"]